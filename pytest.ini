[pytest]
# pytest 配置。

# 测试路径。
testpaths = tests

# 输出选项：
# -q  减少冗余输出
# --strict-markers  未注册的 marker 直接报错（避免拼写错误被静默忽略）
# --basetemp  把临时目录固定到项目内。
#   设计原因：本机 %TEMP%/pytest-of-* 目录存在权限异常（PermissionError: WinError 5），
#   pytest 无法在其中创建 numbered dir。指向项目内目录既规避系统临时目录权限问题，
#   也便于清理与查看测试残留。该目录在 .gitignore 中排除，不会被交付。
#   注意：basetemp 只能通过命令行/参数设置，不能写在 ini 里（pytest 会告警 Unknown config option）。
addopts = -q --strict-markers --basetemp=data/.pytest_tmp

# 测试会话超时保护（防止 OCR 相关测试卡死整个 CI）。
timeout = 300

markers =
    slow: 需要真实执行 OCR 或生成文档的较慢测试
